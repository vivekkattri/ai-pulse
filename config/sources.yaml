# Settings for each data source. No secrets here: this file is committed to Git.
hackernews:
  base_url: https://hacker-news.firebaseio.com/v0
  list_endpoint: newstories
  max_items: 500
  request_timeout_seconds: 10
  pause_seconds: 0.05
  max_retries: 3

arxiv:
  base_url: https://export.arxiv.org/api/query
  # cs.AI = artificial intelligence, cs.LG = machine learning,
  # cs.CL = language models and text, cs.DB = databases
  search_query: cat:cs.AI OR cat:cs.LG OR cat:cs.CL OR cat:cs.DB
  page_size: 100
  max_items: 300
  request_timeout_seconds: 30
  pause_seconds: 3
  max_retries: 3
